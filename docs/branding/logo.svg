<?xml version="1.0" encoding="UTF-8"?>
<!--
  REVIX logo. Qo'lda yozilgan SVG: raster yo'q, tashqi font yo'q (harflar kontur), bitta rang
  (fill="currentColor"; ranglanishi joylashtirilgan kontekstning `color` qiymatidan keladi).

  BELGI NIMANI CHIZADI
  Throughput izi (trace): u yuqori darajada yuradi, pastga tushadi (stall / failure), qaytib
  chiqadi. Izning ostidagi qisqa gorizontal planka (bar) qaytishdan boshlanadi va o'ng
  tomonga cho'ziladi: bu verification oynasi [t_up, t_up + W_stab]. Qaytish alohida, oyna
  alohida chizilgan.

  NEGA AYNAN SHU
  Loyihaning bitta ta'rifi: xizmat "qaytdi" degani yetmaydi, qaytgandan keyin oyna davomida
  contract'dan o'tib turishi kerak (PREREGISTRATION.md §4, VR). Belgi shu farqni ko'rsatadi:
  chiziqning qaytishi bor, lekin planka oyna tugamaguncha "tasdiqlangan" degani emas.
  Belgida na qalqon, na qulf, na terminal prompt, na zanjir bor: REVIX xavfsizlik vositasi
  emas, o'lchov asbobi (README.md, "Loyiha nima EMAS").

  Bu belgi hech qanday natijani ifodalamaydi: stall chuqurligi, oyna uzunligi va o'ng
  tomonning uzunroqligi BEZAK, o'lchangan qiymat emas. Belgiga raqam, % yoki rang bilan
  "yaxshi/yomon" ma'nosi yuklanmaydi (00-design-system.md §5).

  GEOMETRIYA (hammasi to'g'ri burchakli, 1 birlik = 1 viewBox birligi)
  Chiziq qalinligi 3. Baland chiziq y=6.5..9.5, past chiziq y=16.5..19.5, planka y=23..26.
  So'z belgisi: shu tarmoqqa (grid) tushadigan monoline bosh harflar: yuqori chegara 6.5,
  asos chizig'i 26 (plankaning pastki qirrasi bilan bir chiziqda). Qiya shtrixlar (R oyog'i,
  V, X) gorizontal kesilgan: yuqori/pastki qirra aynan 6.5 va 26.

  O'LCHAMLAR
  16 px balandlikda belgi o'qiladi; so'z belgisi (REVIX) 24 px balandlikdan pastda ishlatilmaydi
  (jami 99.5 x 19.5 birlik; 16 px da u ~13 px balandlik). Kichikroq joyda icon.svg ishlatiladi.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 6.5 99.5 19.5" width="199" height="39" role="img" aria-labelledby="t">
  <title id="t">REVIX</title>
  <g fill="currentColor">
    <!-- belgi: iz (tushish va qaytish) -->
    <path d="M5 6.5H12.5V16.5H17.5V6.5H27V9.5H20.5V19.5H9.5V9.5H5Z"/>
    <!-- belgi: verification oynasi, qaytishning chap qirrasidan boshlanadi -->
    <path d="M17.5 23H27V26H17.5Z"/>
    <!-- R -->
    <path d="M35 6.5H38V26H35Z M38 6.5H48V9.5H38Z M45 9.5H48V17.75H45Z M38 14.75H45V17.75H38Z M39.18 16.25H42.6L47.92 26H44.5Z"/>
    <!-- E -->
    <path d="M51.5 6.5H54.5V26H51.5Z M54.5 6.5H63V9.5H54.5Z M54.5 14.75H62V17.75H54.5Z M54.5 23H63V26H54.5Z"/>
    <!-- V -->
    <path d="M66.5 6.5H69.61L73.5 20.43L77.39 6.5H80.5L75.055 26H71.945Z"/>
    <!-- I -->
    <path d="M84 6.5H87V26H84Z"/>
    <!-- X -->
    <path d="M90.5 6.5H93.92L104.5 26H101.08Z M101.08 6.5H104.5L93.92 26H90.5Z"/>
  </g>
</svg>
