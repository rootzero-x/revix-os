<?xml version="1.0" encoding="UTF-8"?>
<!--
  REVIX holat belgilari (state vocabulary) varag'i. Spetsifikatsiya: state-indicators.md.
  <symbol> lar (st-*) shu faylning o'zida: GUI ularni nusxalab ishlatadi. Hammasi currentColor.
  Qora fon #080808; yashil/qizil faqat healthy va failed uchun (00-design-system.md, 5-bo'lim).
  Ikkinchi blok: har rang UNGA TENG relative luminance'li kulrangga almashtirilgan simulyatsiya
  (chop etishdagi oq-qora holatning taxmini; haqiqiy printerda tekshirilmagan).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="1180" viewBox="0 0 1100 1180" font-family="ui-monospace, 'Cascadia Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="14">
<defs>
<symbol id="st-healthy" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="6"/></symbol>
<symbol id="st-recovering" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2A6 6 0 0 1 8 14Z"/></symbol>
<symbol id="st-degraded" viewBox="0 0 16 16" fill="currentColor"><path d="M8 2L14.5 13.5H1.5Z"/></symbol>
<symbol id="st-isolated" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 7.25H14V8.75H2Z"/></symbol>
<symbol id="st-failed" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M2 2H14V14H2Z M3.97 5.24L5.24 3.97L8.00 6.73L10.76 3.97L12.03 5.24L9.27 8.00L12.03 10.76L10.76 12.03L8.00 9.27L5.24 12.03L3.97 10.76L6.73 8.00Z"/></symbol>
<symbol id="st-not-measured" viewBox="0 0 16 16" fill="currentColor"><clipPath id="nm-clip"><rect x="2.75" y="2.75" width="10.5" height="10.5"/></clipPath><rect x="2.75" y="2.75" width="10.5" height="10.5" fill="none" stroke="currentColor" stroke-width="1.5"/><g clip-path="url(#nm-clip)" stroke="currentColor" stroke-width="1.25"><path d="M0 8L8 0M0 12L12 0M0 16L16 0M4 16L16 4M8 16L16 8"/></g></symbol>
<symbol id="st-not-run" viewBox="0 0 16 16" fill="currentColor"><rect x="2.75" y="2.75" width="10.5" height="10.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.1 2.1"/></symbol>
<pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#0F0F0F"/><rect width="4" height="1" fill="#888888"/></pattern>
</defs>
