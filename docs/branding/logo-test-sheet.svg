<?xml version="1.0" encoding="UTF-8"?>
<!--
  REVIX logo va icon: o'lcham / fon tekshiruv varag'i. Bu brend aktivi EMAS, tekshiruv vositasi:
  logo.svg va icon.svg dagi AYNAN shu geometriya (path ma'lumotlari nusxa) ni qora va oq fonda,
  bitta rangda (currentColor), 16 px dan 512 px gacha ko'rsatadi.
  Ushbu fayl o'zgarsa va logo.svg / icon.svg o'zgarmasa, ular bir-biridan chetga chiqadi:
  geometriyani o'zgartirganda uchala faylni birga yangilang.
  Fayl 1:1 (1 birlik = 1 px) o'lchamda ochilganda 16 px qatori haqiqiy 16 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1640" height="620" viewBox="0 0 1640 620" font-family="ui-monospace, 'Cascadia Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="12">
  <defs>
    <g id="lockup">
      <path d="M5 6.5H12.5V16.5H17.5V6.5H27V9.5H20.5V19.5H9.5V9.5H5Z"/>
      <path d="M17.5 23H27V26H17.5Z"/>
      <path d="M35 6.5H38V26H35Z M38 6.5H48V9.5H38Z M45 9.5H48V17.75H45Z M38 14.75H45V17.75H38Z M39.18 16.25H42.6L47.92 26H44.5Z"/>
      <path d="M51.5 6.5H54.5V26H51.5Z M54.5 6.5H63V9.5H54.5Z M54.5 14.75H62V17.75H54.5Z M54.5 23H63V26H54.5Z"/>
      <path d="M66.5 6.5H69.61L73.5 20.43L77.39 6.5H80.5L75.055 26H71.945Z"/>
      <path d="M84 6.5H87V26H84Z"/>
      <path d="M90.5 6.5H93.92L104.5 26H101.08Z M101.08 6.5H104.5L93.92 26H90.5Z"/>
    </g>
    <path id="icon" d="M2.25 3.8125H11.625V16.3125H17.875V3.8125H29.75V7.5625H21.625V20.0625H7.875V7.5625H2.25Z M17.875 24.4375H29.75V28.1875H17.875Z"/>
  </defs>

  <!-- QORA FON: belgi #FFFFFF -->
  <rect x="0" y="0" width="820" height="620" fill="#080808"/>
  <g fill="#FFFFFF">
    <text x="24" y="28">qora fon (#080808), belgi #FFFFFF</text>
    <text x="24" y="46">icon 512 px</text>
    <svg x="24" y="56" width="512" height="512" viewBox="0 0 32 32" color="#FFFFFF"><use xlink:href="#icon" fill="currentColor"/></svg>

    <text x="580" y="46">icon 16 / 24 / 32 / 48 / 64 px</text>
    <svg x="580" y="60" width="16" height="16" viewBox="0 0 32 32" color="#FFFFFF"><use xlink:href="#icon" fill="currentColor"/></svg>
    <svg x="612" y="60" width="24" height="24" viewBox="0 0 32 32" color="#FFFFFF"><use xlink:href="#icon" fill="currentColor"/></svg>
    <svg x="652" y="60" width="32" height="32" viewBox="0 0 32 32" color="#FFFFFF"><use xlink:href="#icon" fill="currentColor"/></svg>
    <svg x="700" y="60" width="48" height="48" viewBox="0 0 32 32" color="#FFFFFF"><use xlink:href="#icon" fill="currentColor"/></svg>
    <svg x="580" y="124" width="64" height="64" viewBox="0 0 32 32" color="#FFFFFF"><use xlink:href="#icon" fill="currentColor"/></svg>

    <text x="580" y="226">logo (so'z belgisi bilan), balandlik 16 / 24 / 48 px</text>
    <svg x="580" y="240" width="82" height="16" viewBox="5 6.5 99.5 19.5" color="#FFFFFF"><use xlink:href="#lockup" fill="currentColor"/></svg>
    <svg x="580" y="272" width="123" height="24" viewBox="5 6.5 99.5 19.5" color="#FFFFFF"><use xlink:href="#lockup" fill="currentColor"/></svg>
    <svg x="580" y="312" width="245" height="48" viewBox="5 6.5 99.5 19.5" color="#FFFFFF"><use xlink:href="#lockup" fill="currentColor"/></svg>

    <text x="580" y="402">belgi alohida (logo.svg ning chap qismi), 1:1 (22 x 19.5 px)</text>
    <svg x="580" y="416" width="22" height="19.5" viewBox="5 6.5 22 19.5" color="#FFFFFF"><use xlink:href="#lockup" fill="currentColor"/></svg>
  </g>

  <!-- OQ FON: belgi #080808 -->
  <rect x="820" y="0" width="820" height="620" fill="#FFFFFF"/>
  <g fill="#080808">
    <text x="844" y="28">oq fon (#FFFFFF), belgi #080808</text>
    <text x="844" y="46">icon 512 px</text>
    <svg x="844" y="56" width="512" height="512" viewBox="0 0 32 32" color="#080808"><use xlink:href="#icon" fill="currentColor"/></svg>

    <text x="1400" y="46">icon 16 / 24 / 32 / 48 / 64 px</text>
    <svg x="1400" y="60" width="16" height="16" viewBox="0 0 32 32" color="#080808"><use xlink:href="#icon" fill="currentColor"/></svg>
    <svg x="1432" y="60" width="24" height="24" viewBox="0 0 32 32" color="#080808"><use xlink:href="#icon" fill="currentColor"/></svg>
    <svg x="1472" y="60" width="32" height="32" viewBox="0 0 32 32" color="#080808"><use xlink:href="#icon" fill="currentColor"/></svg>
    <svg x="1520" y="60" width="48" height="48" viewBox="0 0 32 32" color="#080808"><use xlink:href="#icon" fill="currentColor"/></svg>
    <svg x="1400" y="124" width="64" height="64" viewBox="0 0 32 32" color="#080808"><use xlink:href="#icon" fill="currentColor"/></svg>

    <text x="1400" y="226">logo (so'z belgisi bilan), balandlik 16 / 24 / 48 px</text>
    <svg x="1400" y="240" width="82" height="16" viewBox="5 6.5 99.5 19.5" color="#080808"><use xlink:href="#lockup" fill="currentColor"/></svg>
    <svg x="1400" y="272" width="123" height="24" viewBox="5 6.5 99.5 19.5" color="#080808"><use xlink:href="#lockup" fill="currentColor"/></svg>
    <svg x="1400" y="312" width="245" height="48" viewBox="5 6.5 99.5 19.5" color="#080808"><use xlink:href="#lockup" fill="currentColor"/></svg>

    <text x="1400" y="402">belgi alohida, 1:1 (22 x 19.5 px)</text>
    <svg x="1400" y="416" width="22" height="19.5" viewBox="5 6.5 22 19.5" color="#080808"><use xlink:href="#lockup" fill="currentColor"/></svg>
  </g>
</svg>
