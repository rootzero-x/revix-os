# REVIX: cgroup delegatsiyasi user@UID.service uchun.
#
# BU FAYL O'RNATILMADI, sabab: guard kalibratsiyasi davom etmoqda
# (hech qanday image qurilmadi).
#
# NEGA `cpu memory pids` (MAJBURIY):
#   INSTALLATION.md §2 -- "`MemoryMax=`/`MemoryHigh=`/`MemorySwapMax=`/
#   `CPUQuota=`/`TasksMax=` va `cgroup.kill` privilegiyasiz ishlashi
#   uchun". `revix doctor` #3 `delegated_controllers` aynan shu uchlikni
#   talab qiladi, va uning `consequence` matni: "delegatsiya bo'lmasa
#   transient unit'lar MemoryMax=/CPUQuota=/TasksMax= qabul qilmaydi".
#   00-pilot-topologiya.md §4 "Privilegiyasiz ishlaydi (tekshirilgan)"
#   bo'limi ham shu uchlikka tayanadi.
#
# NEGA `io` QO'SHILADI -- bu image'ning ASOSIY ilmiy sababi:
#   FAKT (07-wsl-muhit-tekshiruvlari.md §1.3 #4, host'da o'lchangan):
#       /sys/fs/cgroup/cgroup.controllers     = cpuset cpu io memory hugetlb pids rdma
#       /sys/fs/cgroup/cgroup.subtree_control = cpu memory pids
#   ya'ni `io` mavjud, lekin rootdan pastga YOQILMAGAN, shuning uchun
#   `user@1000.service/cgroup.controllers` da `io` yo'q va `io.max`
#   YOZILMAYDI. `io.pressure` esa baribir O'QILADI (07 §2).
#
#   PREREGISTRATION.md §0 shu sababli "Nazorat qilinadigan IO stall (`io`
#   controller delegated emas)" ni qamrovdan CHIQARADI, va INSTALLATION.md
#   §4 uni **fault class 6** deb nomlaydi.
#
#   Guest'da biz root'miz, demak `io` ni yoqa olamiz (revix-io-delegate.service
#   cgroup root'da, bu fayl user@ darajasida) -> fault class 6 OCHILADI.
#   Bu 00-pilot-topologiya.md §4 ning "root kerak = guest'ga tegishli"
#   prinsipining amaliy natijasi.
#
# GIPOTEZA (09-iso-qurilishi.md §8 G5): bu sozlama guest'da ishlaydi.
#   O'LCHOVI: `revix doctor --json` da #4 `io_delegation` PASS, VA
#   `revixlab.slice/io.max` ga yozish rc=0.
#   BU O'LCHOV BAJARILMADI.
#
# NEGA `cpuset` QO'SHILMAYDI:
#   00-pilot-topologiya.md §4 `cpuset` pinning'ni "Root kerak (P1 da
#   ishlatilMAYDI)" ro'yxatiga qo'yadi va INSTALLATION.md §4 izohi aytadi:
#   "harness `sched_setaffinity` bilan chetlab o'tadi". Ya'ni harness unga
#   TAYANMAYDI, va o'lchanmagan controller qo'shish muhit fingerprint'ini
#   (PREREGISTRATION.md §15) keraksiz o'zgartiradi.

[Service]
Delegate=cpu memory pids io
