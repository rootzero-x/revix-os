# REVIX: seatd FAQAT grafik bandda (kernel cmdline `revix.gui=1`) ishlasin.
#
# NEGA: `revix-gui.service` `Wants=seatd.service` deydi. Systemd `Wants=` ni
# Condition'dan OLDIN bajaradi, ya'ni `revix.gui=1` BO'LMAGAN default bandlarda
# ham revix-gui o'zi `skipped` bo'lsa-da, seatd ishga tushib qolardi. Bu O'LCHANDI
# (11-iso-qurilish-jurnali.md §11): `seatd: active / disabled` default bandda --
# ikkita mavjud band "bugungidek aynan" qolishi shartiga zid. Shu Condition
# seatd'ning o'ziga qo'yiladi.
[Unit]
ConditionKernelCommandLine=revix.gui=1
