# REVIX: tty1 login prompt'i FAQAT grafik bandda (revix.gui=1) o'chiriladi.
#
# NEGA: grafik sessiya tty1'ni oladi (packaging/systemd/revix-gui.service). Avval
# buning uchun revix-gui.service'da `Conflicts=getty@tty1.service` turardi -- va bu
# O'LCHANDI: Conflicts START job'i Condition'dan OLDIN tranzaksiyaga kiradi, ya'ni
# `revix.gui=1` BO'LMAGAN default bandlarda ham getty@tty1 TO'XTATILDI (tty1'dagi
# `login:` yo'qoldi; `systemctl list-units`: getty@tty1.service inactive dead).
# Bu ikkita mavjud bandning "bugungidek aynan" qolishi shartini buzadi.
# Shu sababli getty@tty1'ning O'ZIGA teskari Condition qo'yiladi: grafik bandda
# u o'zini o'tkazib yuboradi, boshqa bandlarda o'zgarmaydi. getty@tty2..6 (Ctrl+Alt+F2
# qochish yo'li) tegilmaydi.
[Unit]
ConditionKernelCommandLine=!revix.gui=1
